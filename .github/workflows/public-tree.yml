name: Public tree guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate-public-tree:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_publication.py --tree HEAD
      - run: python scripts/validate_memory.py
      - run: python scripts/versioning.py check
      - run: python scripts/species_profiles.py validate
      - run: python -m unittest discover -s scripts/tests
  validate-dev-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check PyYAML and skill frontmatter
        run: |
          python -X utf8 - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.agents/skills').glob('*/SKILL.md'))
          assert len(paths) == 6, paths
          for path in paths:
              metadata = yaml.safe_load(path.read_text(encoding='utf-8').split('---', 2)[1])
              assert isinstance(metadata, dict), path
              assert metadata.get('name') and metadata.get('description'), path
              assert metadata['name'] == path.parent.name and metadata['name'].startswith('na-'), path
          print('PyYAML', yaml.__version__, ': six na- skill frontmatters parsed')
          PY
